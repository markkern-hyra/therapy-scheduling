# Dependabot: щотижневі PR з оновленнями npm-пакетів і дій GitHub — з паузою для свіжих версій і групами.
# Куди: .github/dependabot.yml у вашому репо (файл новий; у шаблоні його немає).
# Завдання README: D (ланцюг постачання). Секретів не потребує.
# Джерело: GitHub Docs «Dependabot options reference» (cooldown, groups, ignore), станом на 09.11.2026.
#
# Що тут і навіщо:
# - cooldown (пауза): Dependabot не пропонує версію, доки їй не виповниться N днів. Шкідливі версії пакетів зазвичай
#   знаходять і знімають у перші дні — пауза не дає їм потрапити до вас. Узгоджено з .npmrc min-release-age=7.
#   Пауза НЕ діє на оновлення безпеки (security updates) — вони приходять одразу, якщо в Settings → Code security
#   увімкнено Dependabot security updates (окремий перемикач).
# - groups: дрібні оновлення приходять одним PR, а не десятком.
# - ignore: Supabase CLI 3.x змінює поведінку команд (без --remote вони йдуть у локальну базу) — до demo day лишаємось
#   на закріпленій 2.x, тому мажорне оновлення пакета supabase не пропонуємо.
# - github-actions: Dependabot оновлює дії, закріплені за SHA, разом із коментарем версії (# vX.Y.Z).
#   Для цієї екосистеми cooldown підтримує лише default-days.
# Перевірка: Insights → Dependency graph → Dependabot (останній запуск) або вкладка Pull requests (автор dependabot).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Стек закріплено в AGENTS.md («Стек і версії (не оновлювати без ADR)»): мінорні й мажорні оновлення цих пакетів —
    # лише окремим PR з ADR, не груповим PR бота. Патчі (16.4.x, 19.3.x, 2.117.x, 0.12.x) — можна.
    ignore:
      - dependency-name: supabase # CLI 2.120; 3.x змінює поведінку команд бази
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@fission-ai/openspec" # 1.14.1 — та сама версія, що й глобальний CLI
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: next
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@supabase/supabase-js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@supabase/ssr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: typescript # TypeScript 7 шаблон не перевіряв
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint # ESLint 10 шаблон не перевіряв
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node" # рантайм — Node 24.x, типи — теж 24.x
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # 1.6.28 (patch) підняв peer-залежність до typescript >=6.0.0, а в нас TypeScript 5.9 і typescript-eslint <6.1:
      # npm install на Vercel падав з ERESOLVE (груповий PR #53, 26.11.2026; той самий випадок — демо курсу, PR #42 → #46).
      # Прибрати рядок, коли перейдемо на TypeScript 6 окремим PR з ADR.
      - dependency-name: "@vitest/eslint-plugin"
        versions: [">=1.6.28"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
